[workspace]
resolver = "3"
members = ["crates/*", "python"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/djangovanderplas/SimuCraft"

[workspace.dependencies]
simucraft-contracts = { path = "crates/simucraft-contracts" }
simucraft-format = { path = "crates/simucraft-format" }
simucraft-runtime = { path = "crates/simucraft-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostic is ~250 bytes. Errors are rare and not on hot paths, so boxing it
# everywhere would add noise for no gain.
result_large_err = "allow"
